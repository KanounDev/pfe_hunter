# .github/workflows/pipeline.yml
# Runs PFE Hunter scraper + scoring pipeline on a schedule (free GitHub Actions)
#
# TRIGGERS:
#   - schedule: Every 5 minutes; the database setting controls whether a run is due
#   - workflow_dispatch: Manual trigger from Actions tab
#
# SECRETS REQUIRED (Settings → Secrets and variables → Actions):
#   - DATABASE_URL: Supabase Postgres connection string (with ?sslmode=require)
#   - GEMINI_API_KEY: Google Gemini API key
#   - SUPABASE_URL: Supabase project URL (for CV download)
#   - SUPABASE_SERVICE_KEY: Supabase service role key (for CV download)

name: PFE Hunter Pipeline

on:
  schedule:
    # GitHub cron is only a polling trigger. The actual interval is read from
    # user_settings.scrape_interval_minutes in Supabase below.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

jobs:
  scrape-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node.js dependencies
        run: npm ci --only=production

      - name: Check database schedule
        id: schedule
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import { Client } from 'pg';
          import fs from 'node:fs';

          (async () => {
            // pg lets sslmode in the URL override this ssl object. Remove it so
            // the workflow uses TLS without certificate-chain verification.
            const databaseUrl = new URL(process.env.DATABASE_URL);
            databaseUrl.searchParams.delete('sslmode');
            const client = new Client({ connectionString: databaseUrl.toString(), ssl: { rejectUnauthorized: false } });
            await client.connect();
            const settings = await client.query(
              "SELECT setting_value FROM user_settings WHERE setting_key = 'scrape_interval_minutes'"
            );
            const runs = await client.query(
              "SELECT started_at FROM pipeline_runs ORDER BY started_at DESC LIMIT 1"
            );
            await client.end();

            const intervalMinutes = Number.parseInt(settings.rows[0]?.setting_value || '300', 10);
            const lastRun = runs.rows[0]?.started_at ? new Date(runs.rows[0].started_at) : null;
            const due = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' ||
              !lastRun || Date.now() - lastRun.getTime() >= intervalMinutes * 60 * 1000;

            console.log(`Configured interval: ${intervalMinutes} minute(s)`);
            console.log(`Last run: ${lastRun ? lastRun.toISOString() : 'none'}`);
            console.log(`Pipeline due: ${due}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_run=${due}\n`);
          })().catch((err) => {
            console.error('Could not read pipeline schedule from Supabase:', err);
            process.exit(1);
          });
          NODE

      - name: Download CV from Supabase
        if: steps.schedule.outputs.should_run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Download CV from Supabase Storage using the API's helper
          node -e "
          import('dotenv/config');
          import('${{ github.workspace }}/supabase-storage.mjs').then(async ({ downloadCvFromStorage }) => {
            const pg = await import('pg');
            const databaseUrl = new URL(process.env.DATABASE_URL);
            databaseUrl.searchParams.delete('sslmode');
            const pool = new pg.Pool({ connectionString: databaseUrl.toString(), ssl: { rejectUnauthorized: false } });

            // Get the active CV URL from database
            const { rows } = await pool.query(\`
              SELECT file_path FROM cvs WHERE is_active = true ORDER BY uploaded_at DESC LIMIT 1
            \`);
            await pool.end();

            if (rows.length === 0) {
              console.error('No active CV found in database. Upload a CV via the dashboard first.');
              process.exit(1);
            }

            const cvUrl = rows[0].file_path;
            console.log('Downloading CV from:', cvUrl);

            const buffer = await downloadCvFromStorage(cvUrl);
            const fs = await import('fs');
            fs.writeFileSync('CV.pdf', buffer);
            console.log('CV downloaded successfully (' + buffer.length + ' bytes)');
          }).catch(err => {
            console.error('Failed to download CV:', err.message);
            process.exit(1);
          });
          "
          echo "CV_FILE_PATH=$(pwd)/CV.pdf" >> $GITHUB_ENV

      - name: Run scraper
        if: steps.schedule.outputs.should_run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          echo "============================================================"
          echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Starting PFE Hunter run"
          echo "============================================================"
          echo ""
          echo "[1/2] Running LinkedIn scraper..."
          python scrape_jobspy.py

      - name: Run scoring pipeline
        if: steps.schedule.outputs.should_run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CV_FILE_PATH: ${{ env.CV_FILE_PATH }}
          NODE_ENV: production
        run: |
          echo ""
          echo "[2/2] Running scoring pipeline..."
          node pfe-hunter-pipeline.mjs

      - name: Cleanup
        if: always()
        run: |
          rm -f CV.pdf 2>/dev/null || true

      - name: Report success
        if: success()
        run: |
          echo ""
          echo "============================================================"
          echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Pipeline completed successfully"
          echo "============================================================"

      - name: Report failure
        if: failure()
        run: |
          echo ""
          echo "============================================================"
          echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Pipeline FAILED"
          echo "============================================================"
